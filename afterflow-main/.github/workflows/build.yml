name: Build Afterflow Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Android64 ARM64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Afterflow
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          cli: latest
          combine: true
          target: Android64
          configure-args: -DCMAKE_CXX_SCAN_FOR_MODULES=OFF -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON

      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: Afterflow-Android64
          path: build/**/*.geode
          if-no-files-found: warn
